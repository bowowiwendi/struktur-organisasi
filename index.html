<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Struktur Organisasi Hibrida (Edit Mode)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Gaya dasar untuk struktur pohon */
        .tree-container ul {
            padding-top: 20px; 
            position: relative;
            display: flex;
            justify-content: center;
        }

        .tree-container li {
            text-align: center;
            list-style-type: none;
            position: relative;
            padding: 20px 5px 0 5px;
            transition: all 0.3s;
        }

        /* Garis vertikal penghubung ke atas */
        .tree-container li::before, .tree-container li::after {
            content: '';
            position: absolute; top: 0; right: 50%;
            border-top: 2px solid #cbd5e1;
            width: 50%; height: 20px;
        }
        .tree-container li::after {
            right: auto; left: 50%;
            border-left: 2px solid #cbd5e1;
        }

        .tree-container li:only-child::after, .tree-container li:only-child::before {
            display: none;
        }
        .tree-container li:only-child { padding-top: 0; }
        .tree-container li:first-child::before, .tree-container li:last-child::after { border: 0 none; }
        .tree-container li:last-child::before { border-right: 2px solid #cbd5e1; border-radius: 0 5px 0 0; }
        .tree-container li:first-child::after { border-radius: 5px 0 0 0; }

        .tree-container ul ul::before {
            content: '';
            position: absolute; top: 0; left: 50%;
            border-left: 2px solid #cbd5e1;
            width: 0; height: 20px;
        }

        .member-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e2e8f0;
            position: relative;
        }
        
        .member-grid::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 50%;
            border-left: 2px solid #cbd5e1;
            height: 20px;
        }

        @media print {
            .no-print { display: none !important; }
            body { background-color: white; padding: 0; }
            .print-center-header { 
                text-align: center !important; 
                width: 100%;
                margin-bottom: 2rem;
            }
            .max-w-7xl { max-width: 100% !important; }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8 font-sans text-slate-800">

    <div class="max-w-7xl mx-auto">
        <!-- Header yang dirapikan ke tengah -->
        <header class="mb-10 flex flex-col items-center justify-center text-center print-center-header">
            <div class="space-y-2">
                <h1 id="displayOrgName" class="text-4xl font-extrabold text-slate-900 uppercase tracking-widest border-b-4 border-blue-600 pb-2 inline-block">Struktur Organisasi</h1>
                <p class="text-slate-500 font-medium no-print">Klik ikon pensil pada profil untuk mengedit data personel.</p>
            </div>
            
            <button onclick="window.print()" class="mt-6 no-print flex items-center gap-2 px-6 py-2.5 bg-blue-600 text-white rounded-full hover:bg-blue-700 shadow-xl shadow-blue-200 active:scale-95 transition-all font-bold">
                <i data-lucide="printer" class="w-5 h-5"></i> Cetak Struktur (PDF)
            </button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <!-- Sidebar -->
            <div class="lg:col-span-1 space-y-6 no-print">
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                    <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Pengaturan Judul</h2>
                    <input type="text" id="inputOrgName" oninput="updateOrgName(this.value)" placeholder="Nama Organisasi" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                    <h2 id="formTitle" class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                        <i data-lucide="user-plus" class="text-blue-600" id="formIcon"></i> <span>Tambah Personel</span>
                    </h2>
                    
                    <form id="orgForm" class="space-y-4">
                        <!-- Hidden ID for Edit Mode -->
                        <input type="hidden" id="editNodeId" value="">

                        <div id="parentGroup">
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Atasan / Ketua Seksi</label>
                            <select id="nodeParent" class="w-full px-3 py-2 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Tipe Hubungan</label>
                            <select id="nodeType" class="w-full px-3 py-2 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                                <option value="sub">Bawahan Langsung (Turun)</option>
                                <option value="equal">Anggota Setara (Samping)</option>
                            </select>
                        </div>

                        <div class="grid grid-cols-1 gap-4">
                            <input type="text" id="nodeName" placeholder="Nama Lengkap" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm" required>
                            <input type="text" id="nodeRole" placeholder="Jabatan" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm" required>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Foto</label>
                            <div id="photoDropzone" class="w-full h-20 border-2 border-dashed border-slate-200 rounded-lg flex items-center justify-center cursor-pointer hover:bg-slate-50 relative overflow-hidden">
                                <div id="photoPreviewContent" class="text-slate-400 flex flex-col items-center">
                                    <i data-lucide="image" class="w-4 h-4"></i>
                                    <span class="text-[10px]">Upload</span>
                                </div>
                                <img id="photoPreviewImg" class="hidden absolute inset-0 w-full h-full object-cover">
                            </div>
                            <input type="file" id="nodePhoto" accept="image/*" class="hidden">
                        </div>

                        <div class="flex gap-2">
                            <button type="submit" id="submitBtn" class="flex-1 py-3 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 shadow-md transition-all active:scale-95">
                                Simpan Personel
                            </button>
                            <button type="button" id="cancelBtn" onclick="resetForm()" class="hidden px-4 py-3 bg-slate-100 text-slate-600 font-bold rounded-lg hover:bg-slate-200 transition-all active:scale-95">
                                Batal
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Bagan Utama -->
            <div class="lg:col-span-3 bg-white p-8 rounded-2xl shadow-sm border border-slate-100 overflow-auto min-h-[600px]">
                <div id="chartContainer" class="tree-container">
                </div>
            </div>
        </div>
    </div>

    <script>
        let nodes = [
            { id: '1', name: 'Ketua Umum', role: 'Pimpinan', photo: null, parentId: null, type: 'sub' }
        ];
        let currentPhotoBase64 = null;

        lucide.createIcons();

        const form = document.getElementById('orgForm');
        const editNodeId = document.getElementById('editNodeId');
        const photoInput = document.getElementById('nodePhoto');
        const photoDropzone = document.getElementById('photoDropzone');
        const photoPreviewImg = document.getElementById('photoPreviewImg');
        const photoPreviewContent = document.getElementById('photoPreviewContent');
        const parentSelect = document.getElementById('nodeParent');
        const chartContainer = document.getElementById('chartContainer');
        const formTitle = document.getElementById('formTitle').querySelector('span');
        const submitBtn = document.getElementById('submitBtn');
        const cancelBtn = document.getElementById('cancelBtn');

        function updateOrgName(val) {
            document.getElementById('displayOrgName').innerText = val || "Struktur Organisasi";
        }

        photoDropzone.onclick = () => photoInput.click();
        photoInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onloadend = () => {
                    currentPhotoBase64 = reader.result;
                    photoPreviewImg.src = currentPhotoBase64;
                    photoPreviewImg.classList.remove('hidden');
                    photoPreviewContent.classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        };

        function deleteNode(id) {
            if(confirm("Hapus personel ini dan seluruh cabangnya?")) {
                const getChildren = (pid) => {
                    let toDelete = [pid];
                    nodes.filter(n => n.parentId === pid).forEach(child => {
                        toDelete = [...toDelete, ...getChildren(child.id)];
                    });
                    return toDelete;
                };
                const idsToRemove = getChildren(id);
                nodes = nodes.filter(n => !idsToRemove.includes(n.id));
                renderChart();
                updateParentSelect();
                resetForm();
            }
        }

        function startEdit(id) {
            const node = nodes.find(n => n.id === id);
            if (!node) return;

            editNodeId.value = node.id;
            document.getElementById('nodeName').value = node.name;
            document.getElementById('nodeRole').value = node.role;
            document.getElementById('nodeType').value = node.type;
            document.getElementById('nodeParent').value = node.parentId || 'null';
            
            // Handle Foto
            currentPhotoBase64 = node.photo;
            if (node.photo) {
                photoPreviewImg.src = node.photo;
                photoPreviewImg.classList.remove('hidden');
                photoPreviewContent.classList.add('hidden');
            } else {
                photoPreviewImg.classList.add('hidden');
                photoPreviewContent.classList.remove('hidden');
            }

            // Sembunyikan pemilihan parent untuk root
            document.getElementById('parentGroup').style.display = node.parentId === null ? 'none' : 'block';

            // UI Changes
            formTitle.innerText = "Edit Personel";
            submitBtn.innerText = "Perbarui Data";
            submitBtn.classList.replace('bg-blue-600', 'bg-orange-600');
            submitBtn.classList.replace('hover:bg-blue-700', 'hover:bg-orange-700');
            cancelBtn.classList.remove('hidden');
            
            // Scroll ke form pada mobile
            document.getElementById('orgForm').scrollIntoView({ behavior: 'smooth' });
        }

        function resetForm() {
            form.reset();
            editNodeId.value = "";
            currentPhotoBase64 = null;
            photoPreviewImg.classList.add('hidden');
            photoPreviewContent.classList.remove('hidden');
            formTitle.innerText = "Tambah Personel";
            submitBtn.innerText = "Simpan ke Bagan";
            submitBtn.classList.replace('bg-orange-600', 'bg-blue-600');
            submitBtn.classList.replace('hover:bg-orange-700', 'hover:bg-blue-700');
            cancelBtn.classList.add('hidden');
            document.getElementById('parentGroup').style.display = 'block';
        }

        function updateParentSelect() {
            parentSelect.innerHTML = nodes.map(n => `<option value="${n.id}">${n.name} (${n.role})</option>`).join('');
        }

        function renderNodeCard(node) {
            const photoHtml = node.photo 
                ? `<img src="${node.photo}" class="w-full h-full object-cover">`
                : `<i data-lucide="user" class="text-blue-200 w-5 h-5"></i>`;

            return `
                <div class="relative flex flex-col items-center p-3 mx-auto bg-white border border-slate-200 rounded-xl shadow-sm hover:shadow-md transition-all w-36 group z-10">
                    <div class="absolute -top-2 -right-2 flex gap-1 opacity-0 group-hover:opacity-100 transition-all no-print">
                        <button onclick="startEdit('${node.id}')" class="p-1 bg-orange-500 text-white rounded-full shadow-sm hover:bg-orange-600">
                            <i data-lucide="pencil" class="w-3 h-3"></i>
                        </button>
                        <button onclick="deleteNode('${node.id}')" class="p-1 bg-red-500 text-white rounded-full shadow-sm hover:bg-red-600">
                            <i data-lucide="x" class="w-3 h-3"></i>
                        </button>
                    </div>
                    <div class="w-10 h-10 bg-slate-50 rounded-full mb-2 flex items-center justify-center overflow-hidden border border-slate-100 shadow-inner">
                        ${photoHtml}
                    </div>
                    <h3 class="font-bold text-slate-800 text-center text-[10px] leading-tight h-6 flex items-center justify-center uppercase tracking-tight">${node.name}</h3>
                    <p class="text-blue-600 text-[8px] text-center font-bold mt-1 uppercase bg-blue-50 px-2 py-0.5 rounded-full border border-blue-100">${node.role}</p>
                </div>
            `;
        }

        function generateTreeHTML(parentId) {
            const children = nodes.filter(n => n.parentId === parentId);
            if (children.length === 0) return '';

            const subNodes = children.filter(c => c.type === 'sub');
            const equalNodes = children.filter(c => c.type === 'equal');

            let html = '';

            if (subNodes.length > 0) {
                html += `<ul>`;
                subNodes.forEach(child => {
                    html += `
                        <li>
                            ${renderNodeCard(child)}
                            ${generateTreeHTML(child.id)}
                        </li>
                    `;
                });
                html += `</ul>`;
            }

            if (equalNodes.length > 0) {
                html += `<div class="member-grid">`;
                equalNodes.forEach(member => {
                    html += renderNodeCard(member);
                });
                html += `</div>`;
            }

            return html;
        }

        function renderChart() {
            if (nodes.length === 0) {
                chartContainer.innerHTML = '<div class="text-center text-slate-300 py-20 italic">Bagan Kosong</div>';
            } else {
                const root = nodes.find(n => !n.parentId);
                if (root) {
                    chartContainer.innerHTML = `
                        <ul class="flex flex-col items-center">
                            <li>
                                ${renderNodeCard(root)}
                                ${generateTreeHTML(root.id)}
                            </li>
                        </ul>
                    `;
                }
            }
            lucide.createIcons();
        }

        form.onsubmit = (e) => {
            e.preventDefault();
            const idValue = editNodeId.value;
            const name = document.getElementById('nodeName').value;
            const role = document.getElementById('nodeRole').value;
            const type = document.getElementById('nodeType').value;
            const parentId = parentSelect.value;

            if (idValue) {
                // Update Existing
                const index = nodes.findIndex(n => n.id === idValue);
                if (index !== -1) {
                    nodes[index] = { ...nodes[index], name, role, type, parentId, photo: currentPhotoBase64 };
                }
            } else {
                // Add New
                nodes.push({
                    id: Date.now().toString(),
                    name, role, type, parentId,
                    photo: currentPhotoBase64
                });
            }

            resetForm();
            renderChart();
            updateParentSelect();
        };

        updateParentSelect();
        renderChart();
        document.getElementById('inputOrgName').value = "Struktur Organisasi";
    </script>
</body>
</html>

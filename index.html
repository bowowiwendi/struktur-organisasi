<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Struktur Organisasi Mandiri</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Gaya khusus untuk garis penghubung yang dinamis */
        .tree-container ul {
            padding-top: 20px; 
            position: relative;
            transition: all 0.5s;
            display: flex;
            justify-content: center;
        }

        .tree-container li {
            float: left; 
            text-align: center;
            list-style-type: none;
            position: relative;
            padding: 20px 5px 0 5px;
            transition: all 0.5s;
        }

        /* Garis vertikal penghubung ke atas */
        .tree-container li::before, .tree-container li::after {
            content: '';
            position: absolute; 
            top: 0; 
            right: 50%;
            border-top: 2px solid #cbd5e1;
            width: 50%; 
            height: 20px;
        }
        .tree-container li::after {
            right: auto; 
            left: 50%;
            border-left: 2px solid #cbd5e1;
        }

        /* Hilangkan garis kiri-kanan untuk elemen tunggal/ujung */
        .tree-container li:only-child::after, .tree-container li:only-child::before {
            display: none;
        }
        .tree-container li:only-child { 
            padding-top: 0;
        }
        .tree-container li:first-child::before, .tree-container li:last-child::after {
            border: 0 none;
        }
        .tree-container li:last-child::before {
            border-right: 2px solid #cbd5e1;
            border-radius: 0 5px 0 0;
        }
        .tree-container li:first-child::after {
            border-radius: 5px 0 0 0;
        }

        /* Garis vertikal penghubung ke bawah dari atasan */
        .tree-container ul ul::before {
            content: '';
            position: absolute; 
            top: 0; 
            left: 50%;
            border-left: 2px solid #cbd5e1;
            width: 0; 
            height: 20px;
        }

        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background-color: white;
            }
            .print-center {
                text-align: center;
                width: 100%;
            }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8 font-sans text-slate-800">

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4 print-center">
            <div>
                <h1 id="displayOrgName" class="text-3xl font-extrabold text-slate-900 uppercase tracking-tight">Struktur Organisasi</h1>
                <p class="text-slate-500 no-print">Bangun hierarki tim dengan garis penghubung otomatis.</p>
            </div>
            <div class="flex gap-2 no-print">
                <button onclick="window.print()" class="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 shadow-lg shadow-blue-200 transition-all active:scale-95">
                    <i data-lucide="download" class="w-5 h-5"></i> Cetak PDF
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <!-- Panel Input & Pengaturan -->
            <div class="lg:col-span-1 space-y-6 no-print">
                
                <!-- Pengaturan Nama Organisasi -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                    <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-3 flex items-center gap-2">
                        <i data-lucide="settings" class="w-4 h-4"></i> Pengaturan
                    </h2>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Nama Organisasi</label>
                        <input type="text" id="inputOrgName" oninput="updateOrgName(this.value)" placeholder="Nama Organisasi Anda" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                    </div>
                </div>

                <!-- Form Tambah Anggota -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 h-fit">
                    <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                        <i data-lucide="plus" class="text-blue-600"></i> Tambah Anggota
                    </h2>
                    
                    <form id="orgForm" class="space-y-4">
                        <div id="parentSelectionContainer">
                            <label class="block text-sm font-medium text-slate-600 mb-1">Atasan Langsung</label>
                            <select id="nodeParent" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                                <!-- Opsi akan diisi oleh JavaScript -->
                            </select>
                            <p id="firstNodeHint" class="hidden text-[10px] text-blue-500 mt-1 italic">Ini akan menjadi pemimpin utama baru.</p>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1">Nama Lengkap</label>
                            <input type="text" id="nodeName" placeholder="Contoh: Andi Wijaya" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1">Jabatan</label>
                            <input type="text" id="nodeRole" placeholder="Contoh: Manager" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1">Foto Profil</label>
                            <div id="photoDropzone" class="w-full h-28 border-2 border-dashed border-slate-200 rounded-lg flex flex-col items-center justify-center cursor-pointer hover:bg-slate-50 transition-colors overflow-hidden relative">
                                <div id="photoPreviewContent" class="flex flex-col items-center">
                                    <i data-lucide="camera" class="text-slate-400 mb-1"></i>
                                    <span class="text-[10px] text-slate-500 font-medium">Klik untuk upload</span>
                                </div>
                                <img id="photoPreviewImg" class="hidden absolute inset-0 w-full h-full object-cover">
                            </div>
                            <input type="file" id="nodePhoto" accept="image/*" class="hidden">
                        </div>

                        <button type="submit" class="w-full py-3 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition-all shadow-md shadow-blue-100 active:scale-95">
                            Tambah ke Struktur
                        </button>
                    </form>
                </div>
            </div>

            <!-- Canvas Visualisasi -->
            <div class="lg:col-span-3 bg-white p-8 rounded-2xl shadow-sm border border-slate-100 overflow-auto min-h-[600px]">
                <div id="chartContainer" class="tree-container w-full min-w-max">
                    <!-- Pohon akan dirender di sini -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // State awal
        let nodes = [
            { id: '1', name: 'Budi Santoso', role: 'CEO / Direktur Utama', photo: null, parentId: null }
        ];
        let currentPhotoBase64 = null;
        let orgName = "Struktur Organisasi";

        // Inisialisasi Ikon
        lucide.createIcons();

        // Elemen DOM
        const form = document.getElementById('orgForm');
        const photoInput = document.getElementById('nodePhoto');
        const photoDropzone = document.getElementById('photoDropzone');
        const photoPreviewImg = document.getElementById('photoPreviewImg');
        const photoPreviewContent = document.getElementById('photoPreviewContent');
        const parentSelect = document.getElementById('nodeParent');
        const chartContainer = document.getElementById('chartContainer');
        const firstNodeHint = document.getElementById('firstNodeHint');
        const displayOrgName = document.getElementById('displayOrgName');
        const inputOrgName = document.getElementById('inputOrgName');

        // Handle Nama Organisasi
        function updateOrgName(val) {
            orgName = val || "Struktur Organisasi";
            displayOrgName.innerText = orgName;
        }

        // Handle Upload Foto
        photoDropzone.onclick = () => photoInput.click();

        photoInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onloadend = () => {
                    currentPhotoBase64 = reader.result;
                    photoPreviewImg.src = currentPhotoBase64;
                    photoPreviewImg.classList.remove('hidden');
                    photoPreviewContent.classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        };

        // Render Dropdown Parent
        function updateParentSelect() {
            if (nodes.length === 0) {
                parentSelect.innerHTML = '<option value="null">-- Pemimpin Utama --</option>';
                firstNodeHint.classList.remove('hidden');
            } else {
                parentSelect.innerHTML = nodes.map(node => 
                    `<option value="${node.id}">${node.name} (${node.role})</option>`
                ).join('');
                firstNodeHint.classList.add('hidden');
            }
        }

        // Fungsi Hapus
        function deleteMember(id) {
            const getChildIds = (parentId) => {
                let ids = [parentId];
                const children = nodes.filter(n => n.parentId === parentId);
                children.forEach(child => {
                    ids = [...ids, ...getChildIds(child.id)];
                });
                return ids;
            };

            const idsToDelete = getChildIds(id);
            nodes = nodes.filter(node => !idsToDelete.includes(node.id));
            
            renderChart();
            updateParentSelect();
        }

        // Render Pohon (Rekursif)
        function generateHTML(nodeId) {
            const node = nodes.find(n => n.id === nodeId);
            if (!node) return '';

            const children = nodes.filter(n => n.parentId === node.id);
            const hasChildren = children.length > 0;

            const photoHtml = node.photo 
                ? `<img src="${node.photo}" class="w-full h-full object-cover">`
                : `<i data-lucide="camera" class="text-blue-200 w-6 h-6"></i>`;

            return `
                <li>
                    <div class="relative flex flex-col items-center p-4 mx-auto bg-white border-2 border-slate-100 rounded-xl shadow-sm hover:shadow-md transition-all duration-300 w-44 group z-10">
                        <button onclick="deleteMember('${node.id}')" class="absolute -top-2 -right-2 p-1.5 bg-red-500 text-white rounded-full opacity-0 group-hover:opacity-100 transition-all no-print hover:bg-red-600 shadow-sm active:scale-90">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                        </button>
                        <div class="w-14 h-14 bg-slate-50 rounded-full mb-2 flex items-center justify-center overflow-hidden border-2 border-slate-100 shadow-inner">
                            ${photoHtml}
                        </div>
                        <h3 class="font-bold text-slate-800 text-center text-xs leading-tight h-8 flex items-center justify-center overflow-hidden">${node.name}</h3>
                        <p class="text-blue-600 text-[9px] text-center font-bold mt-1 uppercase tracking-wider bg-blue-50 px-2 py-0.5 rounded-full">${node.role}</p>
                    </div>
                    ${hasChildren ? `
                        <ul>
                            ${children.map(child => generateHTML(child.id)).join('')}
                        </ul>
                    ` : ''}
                </li>
            `;
        }

        function renderChart() {
            if (nodes.length === 0) {
                chartContainer.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-slate-300 py-20">
                        <i data-lucide="users" class="w-20 h-20 mb-4 opacity-20"></i>
                        <p class="font-medium">Struktur masih kosong</p>
                    </div>`;
            } else {
                const rootNodes = nodes.filter(n => !n.parentId || !nodes.find(parent => parent.id === n.parentId));
                chartContainer.innerHTML = `<ul>${rootNodes.map(root => generateHTML(root.id)).join('')}</ul>`;
            }
            lucide.createIcons();
        }

        // Handle Submit Form
        form.onsubmit = (e) => {
            e.preventDefault();
            const name = document.getElementById('nodeName').value;
            const role = document.getElementById('nodeRole').value;
            const parentValue = parentSelect.value;
            
            const newNode = {
                id: Date.now().toString(),
                name,
                role,
                photo: currentPhotoBase64,
                parentId: (parentValue === "null" || nodes.length === 0) ? null : parentValue
            };

            nodes.push(newNode);
            
            // Reset Form
            form.reset();
            currentPhotoBase64 = null;
            photoPreviewImg.classList.add('hidden');
            photoPreviewContent.classList.remove('hidden');
            
            renderChart();
            updateParentSelect();
            parentSelect.value = newNode.id;
        };

        // Inisialisasi awal
        updateParentSelect();
        renderChart();
        inputOrgName.value = "Struktur Organisasi";
    </script>
</body>
</html>

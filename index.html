<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Struktur Organisasi Mandiri</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Gaya khusus untuk garis penghubung dan cetak */
        .tree-node::before {
            content: "";
            position: absolute;
            top: -1rem;
            left: 50%;
            width: 1px;
            height: 1rem;
            background-color: #e2e8f0;
        }
        .tree-node:first-child::before {
            display: none;
        }
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background-color: white;
            }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8 font-sans">

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4 no-print">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-800">Struktur Organisasi</h1>
                <p class="text-slate-500">Bangun dan visualisasikan hierarki tim Anda dengan foto.</p>
            </div>
            <div class="flex gap-2">
                <button onclick="window.print()" class="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 shadow-lg shadow-blue-200">
                    <i data-lucide="download" class="w-5 h-5"></i> Cetak PDF
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <!-- Panel Input -->
            <div class="lg:col-span-1 bg-white p-6 rounded-2xl shadow-sm border border-slate-100 h-fit no-print">
                <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                    <i data-lucide="plus" class="text-blue-600"></i> Tambah Anggota
                </h2>
                
                <form id="orgForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Nama Lengkap</label>
                        <input type="text" id="nodeName" placeholder="Contoh: Andi Wijaya" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Jabatan</label>
                        <input type="text" id="nodeRole" placeholder="Contoh: Manager" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Atasan Langsung</label>
                        <select id="nodeParent" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                            <!-- Opsi akan diisi oleh JavaScript -->
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Foto Profil</label>
                        <div id="photoDropzone" class="w-full h-32 border-2 border-dashed border-slate-200 rounded-lg flex flex-col items-center justify-center cursor-pointer hover:bg-slate-50 transition-colors overflow-hidden relative">
                            <div id="photoPreviewContent" class="flex flex-col items-center">
                                <i data-lucide="camera" class="text-slate-400 mb-2"></i>
                                <span class="text-xs text-slate-500">Klik untuk upload</span>
                            </div>
                            <img id="photoPreviewImg" class="hidden absolute inset-0 w-full h-full object-cover">
                        </div>
                        <input type="file" id="nodePhoto" accept="image/*" class="hidden">
                    </div>

                    <button type="submit" class="w-full py-3 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition-colors shadow-md">
                        Tambah ke Struktur
                    </button>
                </form>
            </div>

            <!-- Canvas Visualisasi -->
            <div class="lg:col-span-3 bg-white p-8 rounded-2xl shadow-sm border border-slate-100 overflow-auto min-h-[600px] flex justify-center">
                <div id="chartContainer" class="inline-block pt-4">
                    <!-- Pohon akan dirender di sini -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // State awal
        let nodes = [
            { id: '1', name: 'Budi Santoso', role: 'CEO / Direktur Utama', photo: null, parentId: null }
        ];
        let currentPhotoBase64 = null;

        // Inisialisasi Ikon
        lucide.createIcons();

        // Elemen DOM
        const form = document.getElementById('orgForm');
        const photoInput = document.getElementById('nodePhoto');
        const photoDropzone = document.getElementById('photoDropzone');
        const photoPreviewImg = document.getElementById('photoPreviewImg');
        const photoPreviewContent = document.getElementById('photoPreviewContent');
        const parentSelect = document.getElementById('nodeParent');
        const chartContainer = document.getElementById('chartContainer');

        // Handle Upload Foto
        photoDropzone.onclick = () => photoInput.click();

        photoInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onloadend = () => {
                    currentPhotoBase64 = reader.result;
                    photoPreviewImg.src = currentPhotoBase64;
                    photoPreviewImg.classList.remove('hidden');
                    photoPreviewContent.classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        };

        // Render Dropdown Parent
        function updateParentSelect() {
            parentSelect.innerHTML = nodes.map(node => 
                `<option value="${node.id}">${node.name} (${node.role})</option>`
            ).join('');
        }

        // Fungsi Hapus
        function deleteMember(id) {
            if (id === '1') return;
            
            const getChildIds = (parentId) => {
                let ids = [parentId];
                const children = nodes.filter(n => n.parentId === parentId);
                children.forEach(child => {
                    ids = [...ids, ...getChildIds(child.id)];
                });
                return ids;
            };

            const idsToDelete = getChildIds(id);
            nodes = nodes.filter(node => !idsToDelete.includes(node.id));
            renderChart();
            updateParentSelect();
        }

        // Render Pohon (Rekursif)
        function renderNode(node) {
            const children = nodes.filter(n => n.parentId === node.id);
            const hasChildren = children.length > 0;

            const photoHtml = node.photo 
                ? `<img src="${node.photo}" class="w-full h-full object-cover">`
                : `<i data-lucide="camera" class="text-blue-300 w-6 h-6"></i>`;

            const deleteBtn = node.parentId 
                ? `<button onclick="deleteMember('${node.id}')" class="absolute -top-2 -right-2 p-1 bg-red-500 text-white rounded-full opacity-0 group-hover:opacity-100 transition-opacity no-print">
                    <i data-lucide="trash-2" class="w-3 h-3"></i>
                   </button>`
                : '';

            let html = `
                <div class="flex flex-col items-center tree-node relative">
                    <div class="relative flex flex-col items-center p-4 m-2 bg-white border-2 border-blue-100 rounded-xl shadow-sm hover:shadow-md transition-all duration-300 w-48 group">
                        ${deleteBtn}
                        <div class="w-16 h-16 bg-blue-50 rounded-full mb-3 flex items-center justify-center overflow-hidden border-2 border-blue-200">
                            ${photoHtml}
                        </div>
                        <h3 class="font-bold text-gray-800 text-center text-sm leading-tight">${node.name}</h3>
                        <p class="text-blue-600 text-xs text-center font-medium mt-1">${node.role}</p>
                    </div>
                    ${hasChildren ? `
                        <div class="flex flex-row items-start mt-4">
                            ${children.map(child => renderNode(child)).join('')}
                        </div>
                    ` : ''}
                </div>
            `;
            return html;
        }

        function renderChart() {
            chartContainer.innerHTML = renderNode(nodes[0]);
            lucide.createIcons();
        }

        // Handle Submit Form
        form.onsubmit = (e) => {
            e.preventDefault();
            const name = document.getElementById('nodeName').value;
            const role = document.getElementById('nodeRole').value;
            const parentId = parentSelect.value;

            const newNode = {
                id: Date.now().toString(),
                name,
                role,
                photo: currentPhotoBase64,
                parentId
            };

            nodes.push(newNode);
            
            // Reset Form
            form.reset();
            currentPhotoBase64 = null;
            photoPreviewImg.classList.add('hidden');
            photoPreviewContent.classList.remove('hidden');
            
            renderChart();
            updateParentSelect();
            // Set default parent ke yang baru ditambah untuk memudahkan
            parentSelect.value = newNode.id;
        };

        // Inisialisasi awal
        updateParentSelect();
        renderChart();
    </script>
</body>
</html>
